services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: workora-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  identity-db:
    image: postgres:16-alpine
    container_name: workora-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5433:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  organization-db:
    image: postgres:16-alpine
    container_name: workora-organization-db
    environment:
      POSTGRES_DB: organization_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5434:5432"
    volumes:
      - organization-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d organization_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  project-db:
    image: postgres:16-alpine
    container_name: workora-project-db
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5435:5432"
    volumes:
      - project-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d project_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  work-db:
    image: postgres:16-alpine
    container_name: workora-work-db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5436:5432"
    volumes:
      - work-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bug-db:
    image: postgres:16-alpine
    container_name: workora-bug-db
    environment:
      POSTGRES_DB: bug_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5437:5432"
    volumes:
      - bug-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d bug_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  recruitment-db:
    image: postgres:16-alpine
    container_name: workora-recruitment-db
    environment:
      POSTGRES_DB: recruitment_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5438:5432"
    volumes:
      - recruitment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: workora-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5439:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    container_name: workora-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora123
    ports:
      - "5440:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: .
      args:
        SERVICE: identity-service
    container_name: identity-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/workora
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: workora
      KEYCLOAK_CLIENT_ID: workora-api
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8101:8101"
    depends_on:
      identity-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  organization-service:
    build:
      context: .
      args:
        SERVICE: organization-service
    container_name: organization-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://organization-db:5432/organization_db
    ports:
      - "8102:8102"
    depends_on:
      organization-db:
        condition: service_healthy

  project-service:
    build:
      context: .
      args:
        SERVICE: project-service
    container_name: project-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://project-db:5432/project_db
    ports:
      - "8103:8103"
    depends_on:
      project-db:
        condition: service_healthy

  work-service:
    build:
      context: .
      args:
        SERVICE: work-service
    container_name: work-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://work-db:5432/task_db
    ports:
      - "8104:8104"
    depends_on:
      work-db:
        condition: service_healthy

  bug-service:
    build:
      context: .
      args:
        SERVICE: bug-service
    container_name: bug-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://bug-db:5432/bug_db
    ports:
      - "8105:8105"
    depends_on:
      bug-db:
        condition: service_healthy

  recruitment-service:
    build:
      context: .
      args:
        SERVICE: recruitment-service
    container_name: recruitment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://recruitment-db:5432/recruitment_db
    ports:
      - "8106:8106"
    depends_on:
      recruitment-db:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
    ports:
      - "8107:8107"
    depends_on:
      notification-db:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
    ports:
      - "8108:8108"
    depends_on:
      payment-db:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - organization-service
      - project-service
      - work-service
      - bug-service
      - recruitment-service
      - notification-service
      - payment-service

networks:
  default:
    name: workora-microservices_default
    external: true

volumes:
  identity-db-data:
  organization-db-data:
  project-db-data:
  work-db-data:
  bug-db-data:
  recruitment-db-data:
  notification-db-data:
  payment-db-data:
